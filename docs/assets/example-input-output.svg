<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="t d">
  <title id="t">商单对账报告对照</title>
  <desc id="d">左侧为合同与交付记录输入，右侧为脚本生成的对账报告节选，合成样本</desc>
  <rect width="1440" height="760" fill="#F4F1E8"/>
  <text x="72" y="64" fill="#171A19" font-family="Arial, 'PingFang SC', sans-serif" font-size="34" font-weight="800">真实运行对照（合成样本，v0.1.1，基准日 2026-09-17）</text>
  <text x="72" y="96" fill="#555954" font-family="Arial, 'PingFang SC', sans-serif" font-size="18">输入：deal_synthetic_v1.json + delivery_hard_v1.csv → 输出：evals/runs_v1/hard_report.md</text>

  <rect x="72" y="124" width="600" height="596" rx="10" fill="#2A2E2C"/>
  <text x="100" y="170" fill="#F0C94B" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">你要对的两份材料</text>
  <text x="100" y="208" fill="#8FE3D0" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">合同要点</text>
  <text x="100" y="238" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">抖音视频 1 条：09-05 前、必提词 2 个、≥30s、保留 30 天</text>
  <text x="100" y="266" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">小红书图文 2 条：09-10 前、必提词 1 个、保留 14 天</text>
  <text x="100" y="294" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">尾款 70%：发布完成后支付</text>
  <text x="100" y="340" fill="#8FE3D0" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">实际发布记录</text>
  <text x="100" y="370" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">抖音视频 09-07 发布 · 18 秒 · 文案正常</text>
  <text x="100" y="398" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">小红书图文 09-08 发布 · 文案没带品牌名</text>
  <text x="100" y="426" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">微博图文 09-09 发布 · 合同里没有这一条</text>
  <rect x="100" y="470" width="544" height="200" rx="8" fill="#1F231F"/>
  <text x="124" y="504" fill="#E8A9A0" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">人工核对的痛点</text>
  <text x="124" y="534" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">· 逾期几天？保留期到几号？要逐条翻日期</text>
  <text x="124" y="562" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">· 必提词有没有带全？靠肉眼搜聊天记录</text>
  <text x="124" y="590" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">· 尾款到底卡在哪一条？没人说得清</text>
  <text x="124" y="630" fill="#8A8F8B" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">（以上输入与痛点均为合成示例）</text>

  <text x="720" y="440" fill="#171A19" font-family="Arial, 'PingFang SC', sans-serif" font-size="40" font-weight="800">→</text>

  <rect x="768" y="124" width="600" height="596" rx="10" fill="#FFFFFF" stroke="#D8D4C8"/>
  <text x="796" y="170" fill="#1F6F8B" font-family="Arial, 'PingFang SC', sans-serif" font-size="20" font-weight="700">对账报告（脚本真实输出节选）</text>
  <rect x="796" y="192" width="544" height="150" rx="8" fill="#EEF5F8"/>
  <text x="820" y="224" fill="#1F6F8B" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">⚠️ d1｜douyin·视频｜已交付 1/1｜约定期 2026-09-05</text>
  <text x="820" y="252" fill="#3A3F3B" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">[逾期] post-001：发布 2026-09-07 晚于约定 2026-09-05</text>
  <text x="820" y="280" fill="#3A3F3B" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">[时长不足] post-001：18s &lt; 约定 30s</text>
  <text x="820" y="308" fill="#3A3F3B" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">[保留期] post-001：保留中（截止 2026-10-07，剩余 20 天）</text>
  <rect x="796" y="358" width="544" height="122" rx="8" fill="#FDF3F0"/>
  <text x="820" y="390" fill="#B4552F" font-family="Arial, 'PingFang SC', sans-serif" font-size="18" font-weight="700">⚠️ d2｜xiaohongshu·图文｜已交付 1/2｜约定期 2026-09-10</text>
  <text x="820" y="418" fill="#3A3F3B" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">交付缺口：缺少 1 条</text>
  <text x="820" y="446" fill="#3A3F3B" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">[必提词缺失] 「示例品牌」未出现在任何已发布文案</text>
  <rect x="796" y="496" width="544" height="106" rx="8" fill="#171A19"/>
  <text x="820" y="528" fill="#F0C94B" font-family="Arial, 'PingFang SC', sans-serif" font-size="17" font-weight="700">结款节点</text>
  <text x="820" y="556" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">尾款 70%（14000）：未达成（存在缺失交付）</text>
  <text x="820" y="582" fill="#D6D4CB" font-family="Arial, 'PingFang SC', sans-serif" font-size="16">未匹配记录：post-201（微博）请核对 deliverable_id</text>
  <text x="796" y="640" fill="#8A8F8B" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">报告同时声明：链接真实性与平台数据以人工复核为准</text>
  <text x="796" y="666" fill="#8A8F8B" font-family="Arial, 'PingFang SC', sans-serif" font-size="15">同输入两次运行 sha256 一致（确定性）</text>
</svg>
